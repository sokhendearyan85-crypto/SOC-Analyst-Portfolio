<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560"><rect width="1100" height="560" fill="#f5f7f3"/><text x="60" y="68" font-family="Arial" font-size="30" font-weight="700" fill="#172923">Windows telemetry · Event ID comparison</text><text x="60" y="105" font-family="Arial" font-size="17" fill="#63736d">Conceptual reference from study notes · not captured endpoint telemetry</text><g font-family="Arial"><rect x="70" y="160" width="430" height="300" rx="14" fill="#fff" stroke="#9fb29c" stroke-width="3"/><text x="110" y="215" font-size="27" font-weight="700" fill="#172923">Event ID 11</text><text x="110" y="258" font-size="21" fill="#557b35">FileCreate</text><text x="110" y="315" font-size="18" fill="#63736d">• Records file creation activity</text><text x="110" y="353" font-size="18" fill="#63736d">• Review target filename and path</text><text x="110" y="391" font-size="18" fill="#63736d">• Correlate with process context</text><rect x="600" y="160" width="430" height="300" rx="14" fill="#fff" stroke="#9fb29c" stroke-width="3"/><text x="640" y="215" font-size="27" font-weight="700" fill="#172923">Event ID 3</text><text x="640" y="258" font-size="21" fill="#557b35">NetworkConnect</text><text x="640" y="315" font-size="18" fill="#63736d">• Records network connection activity</text><text x="640" y="353" font-size="18" fill="#63736d">• Review source and destination details</text><text x="640" y="391" font-size="18" fill="#63736d">• Correlate with process context</text><path d="M500 310H600" stroke="#6e9b3e" stroke-width="4" stroke-dasharray="10 8"/></g></svg>